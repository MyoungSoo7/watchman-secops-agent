{{- if not .Values.webhook.existingSecret }}
{{- $name := include "watchman.webhookSecretName" . }}
{{- $token := .Values.webhook.token }}
{{- if not $token }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $token = index .data "token" | b64dec }}
{{- end }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "watchman.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
